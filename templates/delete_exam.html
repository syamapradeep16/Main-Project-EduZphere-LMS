{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <i class="fa-solid fa-circle-exclamation fa-4x text-danger"></i>
                    </div>
                    <h3 class="fw-bold">Are you sure?</h3>
                    <p class="text-muted">
                        You are about to delete <strong>"{{ exam.title }}"</strong>. 
                        This will permanently remove all questions and student scores associated with this exam.
                    </p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg rounded-pill">
                                Yes, Delete Exam
                            </button>
                            <a href="{% url 'exam_list' %}" class="btn btn-light btn-lg rounded-pill">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

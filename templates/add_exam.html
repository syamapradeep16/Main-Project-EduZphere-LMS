{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow border-0 rounded-4 p-4">
        <h3>Add New Exam for: {{ course.title }}</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Create Exam</button>
                <a href="{% url 'course_detail' course.id %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
        <p class="mt-3 text-muted small">Note: After clicking "Create Exam", you will be redirected to add MCQ questions automatically.</p>
    </div>
</div>
{% endblock %}

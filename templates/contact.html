{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="contact-content-wrapper">
    <div class="container h-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="contact-card shadow-lg p-5">
                    <div class="text-center mb-5">
                        <div class="icon-circle mb-3 mx-auto">
                            <i class="fa-solid fa-headset text-white fa-2x"></i>
                        </div>
                        <h2 class="fw-bold text-dark">Contact Support</h2>
                        <p class="text-muted">Fill out the form below and we'll get back to you shortly.</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark small">FULL NAME</label>
                            <input type="text" name="name" class="form-control custom-input" placeholder="Full Name" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark small">EMAIL ADDRESS</label>
                            <input type="email" name="email" class="form-control custom-input" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark small">MESSAGE</label>
                            <textarea name="message" class="form-control custom-input" rows="4" placeholder="How can we help you?" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow">
                            SEND MESSAGE <i class="fa-solid fa-paper-plane ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

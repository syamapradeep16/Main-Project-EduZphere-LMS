{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-lg-9">
            <div class="bg-primary rounded-4 overflow-hidden shadow-lg mb-4">
                {% if lesson.video %}
                        <div class="video-container">
                            <video key="{{ lesson.id }}" id="lessonVideo"width="100%" controls controlsList="nodownload">
                                <source src="{{ lesson.video.url }}" type="video/mp4">
                                <source src="{{ lesson.video.url }}" type="video/webm">
                                <source src="{{ lesson.video.url }}" type="video/ogg">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                {% else %}
                    <div class="p-5 text-center text-white">
                        <i class="fas fa-video-slash fa-3x mb-3"></i>
                        <p>No video available for this lesson.</p>
                    </div>
                {% endif %}
            </div>

            <h2 class="fw-bold">{{ lesson.title }}</h2>
            <hr>
            <div class="lesson-content p-3">
                {{ lesson.content|linebreaks }}
            </div>
        </div>

        <div class="col-lg-3">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white fw-bold">Course Content</div>
                <div class="list-group list-group-flush">
                    {% for l in course.lessons.all %}
                        <a href="{% url 'lesson_detail' course.id l.id %}" 
                        class="list-group-item list-group-item-action {% if l.id == lesson.id %}active{% endif %}">
                        <small>{{ forloop.counter }}. {{ l.title }}</small></a>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var video = document.getElementById('lessonVideo');
        if (video) {
            video.load();
        }
    });
</script>
{% endblock %}

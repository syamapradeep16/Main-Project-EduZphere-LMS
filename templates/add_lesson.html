{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h2 class="fw-bold mb-2">Add New Lesson</h2>
                <p class="text-muted mb-4">Adding content to: <strong>{{ course.title }}</strong></p>
                <hr>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-5 rounded-pill">Save Lesson</button>
                        <a href="{% url 'course_detail' course.id %}" class="btn btn-light rounded-pill">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
